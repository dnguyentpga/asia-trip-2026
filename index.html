<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asia Trip 2026/2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A44;
    --ink-soft:#54607a;
    --paper:#EAE7DD;
    --card:#F8F6F0;
    --accent-red:#AE3B34;
    --accent-gold:#A6842A;
    --line:#C7C1AF;
    --rail:#8C97AE;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(30,42,68,0.06) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:18px;
    -webkit-font-smoothing:antialiased;
    padding-bottom:80px;
  }
  .mono{font-family:'JetBrains Mono', monospace;}

  header.hero{
    padding:36px 24px 24px;
    text-align:center;
    border-bottom:2px solid var(--ink);
    background:linear-gradient(180deg, rgba(255,255,255,0.4), transparent);
  }
  header.hero .eyebrow{
    font-family:'JetBrains Mono', monospace;
    letter-spacing:0.24em;
    text-transform:uppercase;
    font-size:14px;
    color:var(--accent-red);
    margin-bottom:8px;
  }
  header.hero h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:clamp(32px, 5.5vw, 46px);
    margin:0 0 7px;
    letter-spacing:0.01em;
  }
  header.hero p{
    margin:0;
    color:var(--ink-soft);
    font-size:18px;
  }
  header.hero .route{
    margin-top:16px;
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
  }
  header.hero .route span.city{font-weight:700;}
  header.hero .route span.arrow{color:var(--rail); align-self:center; margin-top:-10px;}
  header.hero .route span.country{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  header.hero .route .flag-box{
    display:flex;
    align-items:center;
    justify-content:center;
    height:26px;
  }
  header.hero .route .flag-shape{
    width:auto;
    height:26px;
    fill:var(--accent-red);
    opacity:0.82;
    flex:0 0 auto;
  }
  header.hero .route .flag-shape.flag-wide{
    height:17px;
  }

  .layout{
    max-width:960px;
    margin:0 auto;
    display:flex;
    align-items:flex-start;
    gap:20px;
    padding:0 18px;
  }

  nav.tabs{
    position:sticky;
    top:20px;
    z-index:20;
    flex:0 0 240px;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:28px 0;
    max-height:calc(100vh - 40px);
    overflow-y:auto;
  }
  nav.tabs button{
    flex:0 0 auto;
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    padding:10px 16px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
    text-align:left;
    line-height:1.35;
    width:100%;
  }
  nav.tabs button .tab-date{
    display:block;
    font-size:15px;
  }
  nav.tabs button .tab-city{
    display:block;
    font-size:12px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    color:var(--accent-gold);
    opacity:0.85;
    white-space:normal;
    overflow-wrap:break-word;
  }
  nav.tabs button.active .tab-city{
    color:var(--card);
    opacity:0.9;
  }
  nav.tabs button.active{
    background:var(--ink);
    color:var(--card);
    border-color:var(--ink);
  }
  nav.tabs button:hover:not(.active){
    border-color:var(--ink);
    color:var(--ink);
  }

  main{flex:1; min-width:0; max-width:600px; margin:0; padding:28px 0 36px;}

  @media (max-width:760px){
    .layout{
      align-items:flex-start;
      gap:8px;
      padding:0 8px;
    }
    nav.tabs{
      flex:0 0 118px;
      top:8px;
      padding:10px 0;
      gap:6px;
      max-height:calc(100vh - 16px);
    }
    nav.tabs button{
      padding:8px 9px;
      border-radius:8px;
    }
    nav.tabs button .tab-date{font-size:13px;}
    nav.tabs button .tab-city{font-size:11px;}
    main{min-width:0; padding:10px 0 24px;}
  }

  .day{display:none;}
  .day.active{display:block; animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .ticket{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    position:relative;
    overflow:hidden;
    box-shadow:0 1px 0 rgba(30,42,68,0.04);
  }
  .ticket::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:0;
    border-top:2px dashed var(--line);
    margin-top:104px;
  }
  .ticket-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding:22px 24px 22px;
  }
  .ticket-head .daylabel{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:32px;
  }
  .ticket-head .daysub{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    color:var(--accent-gold);
    letter-spacing:0.12em;
    text-transform:uppercase;
    margin-top:4px;
  }
  .ticket-head .stamp{
    width:64px; height:64px;
    border:1.5px solid var(--accent-red);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent-red);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    text-align:center;
    line-height:1.1;
    transform:rotate(-8deg);
    opacity:0.75;
  }

  .stops{padding:30px 24px 26px; position:relative;}
  .stop{
    display:grid;
    grid-template-columns:96px 22px 1fr;
    column-gap:4px;
    position:relative;
  }
  .stop .time{
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    color:var(--ink-soft);
    padding-top:2px;
    text-align:right;
    white-space:normal;
    line-height:1.3;
  }
  .stop .rail{
    position:relative;
    display:flex;
    justify-content:center;
  }
  .stop .rail::before{
    content:"";
    position:absolute;
    top:4px; bottom:-22px;
    width:2px;
    background:var(--rail);
  }
  .stop:last-child .rail::before{display:none;}
  .stop .dot{
    width:10px; height:10px;
    border-radius:50%;
    background:var(--ink);
    margin-top:4px;
    z-index:1;
    border:2px solid var(--card);
  }
  .stop.transit .dot{
    background:var(--card);
    border:2px solid var(--rail);
    width:8px;height:8px;
  }
  .stop-content{padding:0 0 22px 12px;}
  .stop.transit .stop-content .name{
    font-size:16px;
    color:var(--ink-soft);
    font-style:italic;
    font-weight:500;
  }
  .stop-content .name{
    font-weight:700;
    font-size:19px;
    margin-bottom:3px;
  }
  .stop-content .blurb{
    font-size:16px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .badges{margin-top:6px; display:flex; gap:6px; flex-wrap:wrap;}
  .badge{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    padding:3px 10px;
    border-radius:5px;
    background:rgba(166,132,42,0.14);
    color:var(--accent-gold);
    border:1px solid rgba(166,132,42,0.35);
  }
  .badge.time-badge{
    background:rgba(140,151,174,0.15);
    color:var(--rail);
    border-color:rgba(140,151,174,0.4);
  }
  .note{
    margin-top:8px;
    padding:10px 12px;
    border:1px solid rgba(174,59,52,0.4);
    background:rgba(174,59,52,0.07);
    border-radius:8px;
    font-size:15px;
    line-height:1.55;
    color:#7a2a25;
  }
  .note b{color:var(--accent-red);}

  .day + .day{margin-top:0;}
  .daygap{height:28px;}

  footer{
    max-width:720px;
    margin:40px auto 0;
    padding:0 18px;
    color:var(--ink-soft);
    font-size:14px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
  }

  @media (max-width:480px){
    .stop{grid-template-columns:74px 20px 1fr;}
    .ticket-head{flex-direction:column; align-items:flex-start; gap:10px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>

const tabsEl = document.getElementById('tabs');
const daysEl = document.getElementById('days');

DATA.forEach((day, i) => {
  const btn = document.createElement('button');
  btn.innerHTML = `<span class="tab-date">${day.label}</span><span class="tab-city">${day.city || ''}</span>`;
  btn.className = i === 0 ? 'active' : '';
  btn.onclick = () => selectDay(i);
  tabsEl.appendChild(btn);

  const section = document.createElement('section');
  section.className = 'day' + (i === 0 ? ' active' : '');
  section.id = 'day-' + i;

  const stopsHtml = day.stops.map(s => {
    const badgesHtml = (s.badges && s.badges.length)
      ? `<div class="badges">${s.badges.map(b => `<span class="badge${/min|hr/.test(b) ? ' time-badge':''}">${b}</span>`).join('')}</div>`
      : '';
    const noteHtml = s.note ? `<div class="note"><b>Note —</b> ${s.note}</div>` : '';
    return `
      <div class="stop${s.type === 'transit' ? ' transit' : ''}">
        <div class="time mono">${s.t}</div>
        <div class="rail"><div class="dot"></div></div>
        <div class="stop-content">
          <div class="name">${s.name}</div>
          ${s.blurb ? `<div class="blurb">${s.blurb}</div>` : ''}
          ${badgesHtml}
          ${noteHtml}
        </div>
      </div>`;
  }).join('');

  section.innerHTML = `
    <div class="ticket">
      <div class="ticket-head">
        <div>
          <div class="daylabel">${day.label}</div>
          <div class="daysub">${day.sub}${day.city ? ' · ' + day.city : ''}</div>
        </div>
        <div class="stamp mono">${day.stamp}</div>
      </div>
      <div class="stops">${stopsHtml}</div>
    </div>`;

  daysEl.appendChild(section);
});

function selectDay(i){
  document.querySelectorAll('nav.tabs button').forEach((b, idx) => b.classList.toggle('active', idx === i));
  document.querySelectorAll('.day').forEach((d, idx) => d.classList.toggle('active', idx === i));
  window.scrollTo({top: 0, behavior: 'smooth'});
}
